[package]
name = "db-guard"
version = "0.1.2"
edition = "2024"
description = "Bulk Spamhaus DBL checker with XLSX reporting"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hickory-resolver = { version = "0.26.1", features = ["tokio", "system-config"] }
rust_xlsxwriter = "0.99.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
url = "2"
